name: Complete GitHub Actions Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: demo-app
  IMAGE_NAME: demo-app
  REGISTRY: ghcr.io

jobs:

####################################
# Build & Test
####################################

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.10, 3.11]

    outputs:
      image-tag: ${{ github.sha }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Linter
        run: |
          echo "Running flake8..."
          pip install flake8
          flake8 .

      - name: Run Tests
        run: |
          echo "Running Tests..."
          pytest

####################################
# Docker Build
####################################

  docker:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository }}/demo:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}/demo:${{ github.sha }}

####################################
# Upload Artifact
####################################

  artifact:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Artifact
        run: |
          mkdir output
          echo "Build Success" > output/result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/

####################################
# Deploy
####################################

  deploy:

    needs:
      - artifact

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy Application
        env:
          SERVER: ${{ secrets.SERVER }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

        run: |
          echo "Deploying..."
          echo "Server: $SERVER"

####################################
# Notification
####################################

  notify:

    if: always()

    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:

      - name: Print Status
        run: |
          echo "Workflow Finished"
          echo "Status = ${{ job.status }}"
